[project]
name = "jarvis-ubg"
version = "0.1.0"
description = "JARVIS: a Korean/English voice agent for Windows that fights in Roblox 'untitled boxing game' through real screen capture and OS input."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "msgspec>=0.18",
  "pyzmq>=26",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "typer>=0.12",
  "rich>=13",
  "openai>=1.40",
  "httpx>=0.27",
  "rapidfuzz>=3.6",
  "platformdirs>=4",
  "psutil>=5.9",
  "send2trash>=1.8",
  "websockets>=12",
]

[project.optional-dependencies]
# Windows desktop integration (capture, input helpers, UI Automation, audio loopback, tray).
win = [
  "pywin32>=306; sys_platform == 'win32'",
  "windows-capture>=2.0; sys_platform == 'win32'",
  "pyaudiowpatch>=0.2.12; sys_platform == 'win32'",
  "pycaw>=20240316; sys_platform == 'win32'",
  "comtypes>=1.4; sys_platform == 'win32'",
  "uiautomation>=2.0.20; sys_platform == 'win32'",
  "keyring>=25",
  "pystray>=0.19",
  "pillow>=10",
  "nvidia-ml-py>=12",
]
# Voice pipeline: wake word, VAD, STT, echo cancellation, cloud fallback TTS.
voice = [
  "sounddevice>=0.4.7",
  "soundfile>=0.12",
  "openwakeword>=0.6",
  "faster-whisper>=1.1",
  "livekit>=1.0",
  "onnxruntime>=1.18",
  "edge-tts>=6.1",
  "supertonic>=1.3",
]
# GPU inference/training stack (torch from the PyTorch CUDA index on Windows).
gpu = [
  "torch>=2.5",
  "torchvision>=0.20",
  "onnxruntime-gpu>=1.20; sys_platform == 'win32' or sys_platform == 'linux'",
]
speaker = ["speechbrain>=1.0", "torch>=2.5", "torchaudio>=2.5"]
tts-qwen = ["qwen-tts>=0.1.1", "torch>=2.5"]
ml = ["onnx>=1.16", "onnxruntime>=1.18", "pyarrow>=15", "scikit-learn>=1.4"]
detect = ["ultralytics>=8.3"]
web = ["ddgs>=9", "trafilatura>=1.12", "yt-dlp>=2025.1.1"]
ocr = ["rapidocr>=3.0", "onnxruntime>=1.18"]
kb = ["sqlite-vec>=0.1.6"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.uv]
default-groups = []

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "windows: needs a real Windows desktop session",
  "gpu: needs an NVIDIA GPU",
  "live: needs Roblox / UBG running on the user's PC",
  "pwsh: needs PowerShell (pwsh) installed",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",    # long lines are fine in tables/configs
  "RUF001",  # Korean text contains characters ruff flags as ambiguous
  "RUF002",
  "RUF003",
  "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
