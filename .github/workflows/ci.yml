name: ci

on:
  push:
  pull_request:

jobs:
  python-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Lint
        run: uv run --no-sync ruff check src tests
      - name: Unit + replay tests
        run: uv run --no-sync pytest -m "not windows and not gpu and not live"

  python-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev,win]"
      - name: Tests (incl. Windows API smoke tests; no GPU, no Roblox)
        run: uv run --no-sync pytest -m "not gpu and not live"

  hud:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('hud/package.json') != '' }}
    defaults:
      run:
        working-directory: hud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
